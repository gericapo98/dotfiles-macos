# Theming
# NOTE: original repo generates this at runtime via quickshell + wallpaper
# (Material You), which doesn't run on macOS. This is a one-time static
# snapshot, produced by running the repo's own generate_colors_material.py
# against its default_wallpaper.jpg — same algorithm, same source image,
# just resolved once instead of regenerated live.
include kitty-theme.conf

# Font
font_family      JetBrains Mono Nerd Font
font_size 11.0

# Cursor
cursor_shape beam
cursor_trail 1

# Padding (why weird value? consistency with foot)
window_margin_width 21.75

# No stupid close confirmation
confirm_os_window_close 0

# Copy
map ctrl+c    copy_or_interrupt

# Search
map ctrl+f   launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id
map kitty_mod+f   launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id

# Scroll & Zoom
map page_up    scroll_page_up
map page_down    scroll_page_down

map ctrl+plus  change_font_size all +1
map ctrl+equal  change_font_size all +1
map ctrl+kp_add  change_font_size all +1
map ctrl+minus       change_font_size all -1
map ctrl+underscore       change_font_size all -1
map ctrl+kp_subtract       change_font_size all -1
map ctrl+0 change_font_size all 0
map ctrl+kp_0 change_font_size all 0

# --- Extra keybindings from markeglseder/best-kitty.conf ---
# https://github.com/markeglseder/best-kitty.conf

## Copy/Paste Operations
map cmd+\ clear_selection
map cmd+shift+c copy_and_clear_or_interrupt
map cmd+shift+a copy_ansi_to_clipboard
map cmd+shift+x copy_or_interrupt
map cmd+c copy_to_clipboard
map cmd+shift+o pass_selection_to_program
map cmd+v paste_from_clipboard
map cmd+shift+b copy_to_buffer a
map cmd+shift+p paste_from_buffer a
map cmd+shift+s paste_from_selection

## Scrolling Operations
map kitty_mod+end scroll_end
map kitty_mod+home scroll_home
map cmd+down scroll_line_down
map cmd+up scroll_line_up
map kitty_mod+page_down scroll_page_down
map kitty_mod+page_up scroll_page_up
map kitty_mod+z scroll_to_prompt -1
map kitty_mod+x scroll_to_prompt 1

## Tab Management
map kitty_mod+q close_tab
map cmd+t new_tab
map cmd+right next_tab
map cmd+left previous_tab
map kitty_mod+alt+t set_tab_title

## Window Management
map cmd+enter new_window
map cmd+n new_os_window
map cmd+w close_window
map cmd+r start_resizing_window
map kitty_mod+] next_window
map kitty_mod+[ previous_window
map kitty_mod+f move_window_forward
map kitty_mod+b move_window_backward
map kitty_mod+` move_window_to_top
map kitty_mod+f7 focus_visible_window
map kitty_mod+f8 swap_with_window
map kitty_mod+1 first_window
map kitty_mod+2 second_window
map kitty_mod+3 third_window
map kitty_mod+4 fourth_window
map kitty_mod+5 fifth_window
map kitty_mod+6 sixth_window
map kitty_mod+7 seventh_window
map kitty_mod+8 eighth_window
map kitty_mod+9 ninth_window
map kitty_mod+0 tenth_window

## Debugging
map kitty_mod+f6 debug_config

## Miscellaneous
map cmd+f11 toggle_fullscreen
map kitty_mod+f10 toggle_maximized
map opt+cmd+s toggle_macos_secure_keyboard_entry
map cmd+, edit_config_file
map cmd+. load_config_file
map shift+cmd+/ show_kitty_doc overview
map cmd+q quit
map kitty_mod+delete clear_terminal reset active
map kitty_mod+e open_url_with_hints
map kitty_mod+f5 load_config_file
